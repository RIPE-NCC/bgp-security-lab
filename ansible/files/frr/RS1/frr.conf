interface to_IXP
 description "IXP LAN Connection"
 ipv6 address 2001:db8:30:30::8/64
exit
!
ipv6 prefix-list ANY seq 10 permit any
!
interface eth0
 description "Default network, do not use"
 shutdown
exit
!
router bgp 30
 bgp router-id 192.0.2.8
 no bgp default ipv4-unicast
 neighbor 2001:db8:30:30::1 remote-as 100
 neighbor 2001:db8:30:30::1 description Sandbox Inc.
 neighbor 2001:db8:30:30::b remote-as 300
 neighbor 2001:db8:30:30::b description Peer B
 neighbor 2001:db8:30:30::c remote-as 400
 neighbor 2001:db8:30:30::c description Peer C
 !
 address-family ipv6 unicast
  neighbor 2001:db8:30:30::1 activate
  neighbor 2001:db8:30:30::1 route-server-client
  neighbor 2001:db8:30:30::1 prefix-list ANY in
  neighbor 2001:db8:30:30::1 prefix-list ANY out
  neighbor 2001:db8:30:30::1 attribute-unchanged next-hop
  neighbor 2001:db8:30:30::b activate
  neighbor 2001:db8:30:30::b route-server-client
  neighbor 2001:db8:30:30::b prefix-list ANY in
  neighbor 2001:db8:30:30::b prefix-list ANY out
  neighbor 2001:db8:30:30::b attribute-unchanged next-hop
  neighbor 2001:db8:30:30::c activate
  neighbor 2001:db8:30:30::c route-server-client
  neighbor 2001:db8:30:30::c prefix-list ANY in
  neighbor 2001:db8:30:30::c prefix-list ANY out
  neighbor 2001:db8:30:30::c attribute-unchanged next-hop
 exit-address-family
exit
!
end
